[mypy]
python_version = 3.12
exclude = (?x)(^output/|^logs/|^caches/|^tests/|__pycache__|html_report)

# Third-party libraries without bundled type stubs. Install
# `types-openpyxl` etc. if you want fuller checking later.
[mypy-nodriver.*]
ignore_missing_imports = True
[mypy-bs4.*]
ignore_missing_imports = True
[mypy-openpyxl.*]
ignore_missing_imports = True
[mypy-requests.*]
ignore_missing_imports = True

# We don't enforce strict mode project-wide yet (would touch ~every file).
# When ready, flip these on and resolve the surfacing issues:
# disallow_untyped_defs = True
# warn_return_any      = True
# warn_unused_ignores  = True
